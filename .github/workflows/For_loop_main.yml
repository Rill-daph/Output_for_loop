name: Build Android

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Give Executable Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Daffa-Dwi-sulistiyo05.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Daffa_Dwi_SulistiyoXIPPLG2
          path: build/app/outputs/flutter-apk/Daffa-Dwi-sulistiyo05.apk
